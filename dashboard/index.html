<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TACTIS-VR Command</title><style>
*{box-sizing:border-box}body{margin:0;background:#071018;color:#eaf3f7;font:14px system-ui,Arial}.app{max-width:1200px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}.brand{font-size:20px;font-weight:900;letter-spacing:1px}.brand b{color:#35d0ff}.pill{padding:7px 10px;border:1px solid #263c49;border-radius:20px;color:#9db2bd}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:12px}.card{background:#0d1923;border:1px solid #223746;border-radius:15px;overflow:hidden}.head{padding:11px 13px;border-bottom:1px solid #223746;font-size:12px;font-weight:800;letter-spacing:.7px}.body{padding:12px}.world{height:520px;background:#061017}.world canvas{width:100%;height:100%;display:block}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:auto}.btn{height:58px;border:1px solid #2b4656;border-radius:12px;background:#102431;color:#eaf3f7;font-size:20px;font-weight:800;touch-action:none}.btn:active{background:#16475a}.stop{background:#351b21;border-color:#71343d}.mode{display:flex;gap:7px;margin-bottom:12px}.mode button,.action{flex:1;padding:10px;border:1px solid #263c49;border-radius:10px;background:#0a151e;color:#9db2bd;font-weight:800}.mode .on{color:#35d0ff;border-color:#28718b}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:10px;background:#09151e;border:1px solid #223746;border-radius:10px}.stat small{color:#8fa6b1}.stat strong{display:block;font-size:18px;margin-top:3px}.cam{aspect-ratio:16/9;background:#09151e;border:1px solid #223746;border-radius:10px;display:grid;place-items:center;color:#6f8792;font-size:11px}.actions{display:flex;gap:8px;margin-top:10px}.full{grid-column:1/-1}.log{height:120px;overflow:auto;background:#061017;border:1px solid #223746;border-radius:10px;padding:8px;font:11px monospace;color:#9db2bd}.mission{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mission button{padding:11px;border:1px solid #263c49;border-radius:10px;background:#0a151e;color:#eaf3f7;font-weight:800}@media(max-width:800px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.world{height:380px}}@media(max-width:480px){.world{height:320px}.app{padding:8px}}
</style></head><body><div class="app"><div class="top"><div class="brand">TACTIS<b>-VR</b> COMMAND</div><div><span class="pill">● SIM ONLINE</span> <span class="pill">MISSION: <b id="ms">READY</b></span></div></div><div class="grid">
<section class="card"><div class="head">DIGITAL TWIN · SOFTWARE SIMULATION</div><div class="world"><canvas id="c"></canvas></div></section>
<section class="card"><div class="head">VIRTUAL ROVER CONTROL</div><div class="body"><div class="mode"><button id="man" class="on">MANUAL</button><button id="aut">AUTONOMOUS</button></div><div class="controls"><span></span><button class="btn" data-c="f">▲</button><span></span><button class="btn" data-c="l">◀</button><button class="btn stop" data-c="s">■</button><button class="btn" data-c="r">▶</button><span></span><button class="btn" data-c="b">▼</button><span></span></div><div class="actions"><button class="action" id="reset">RESET</button><button class="action" id="estop">STOP SIM</button></div></div></section>
<section class="card"><div class="head">TELEMETRY</div><div class="body"><div class="stats"><div class="stat"><small>POSITION</small><strong id="p">0, 0</strong></div><div class="stat"><small>HEADING</small><strong id="h">0°</strong></div><div class="stat"><small>SPEED</small><strong id="v">0.0 m/s</strong></div><div class="stat"><small>TARGET DIST.</small><strong id="d">0 m</strong></div></div></div></section>
<section class="card"><div class="head">CAMERA PLACEHOLDER</div><div class="body"><div class="cam">ESP32-CAM STREAM WILL APPEAR HERE</div></div></section>
<section class="card full"><div class="head">MISSION</div><div class="body"><div class="mission"><button id="target">SET VIRTUAL TARGET</button><button id="start">START AUTONOMOUS SIM</button></div><div class="log" id="log" style="margin-top:9px"></div></div></section></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H;function size(){let r=c.getBoundingClientRect();W=r.width;H=r.height;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',size);size();
let q={x:0,y:0,a:0,v:0,auto:false,stop:false,t:{x:140,y:-90}};function log(s){let e=document.getElementById('log');e.innerHTML+=`<div>[${new Date().toLocaleTimeString()}] ${s}</div>`;e.scrollTop=e.scrollHeight}function cmd(k){if(q.stop)return;if(k==='s')q.v=0;else if(k==='f')q.v=1.2;else if(k==='b')q.v=-1;else if(k==='l')q.a-=.16;else if(k==='r')q.a+=.16;log('Virtual command: '+k.toUpperCase())}
document.querySelectorAll('.btn').forEach(b=>b.onpointerdown=e=>{e.preventDefault();cmd(b.dataset.c)});document.getElementById('reset').onclick=()=>{q={x:0,y:0,a:0,v:0,auto:false,stop:false,t:q.t};document.getElementById('ms').textContent='READY';log('Simulation reset')};document.getElementById('estop').onclick=()=>{q.v=0;q.auto=false;q.stop=true;document.getElementById('ms').textContent='STOPPED';log('Simulation stopped')};document.getElementById('man').onclick=()=>{q.auto=false;q.stop=false;document.getElementById('man').classList.add('on');document.getElementById('aut').classList.remove('on');log('Manual mode')};document.getElementById('aut').onclick=()=>{q.auto=true;q.stop=false;document.getElementById('aut').classList.add('on');document.getElementById('man').classList.remove('on');document.getElementById('ms').textContent='RUNNING';log('Autonomous simulation started')};document.getElementById('target').onclick=()=>{q.t={x:(Math.random()-.5)*420,y:(Math.random()-.5)*280};document.getElementById('ms').textContent='TARGET ACTIVE';log('Virtual target moved')};document.getElementById('start').onclick=()=>{q.auto=true;q.stop=false;document.getElementById('ms').textContent='RUNNING';log('Autonomous simulation started')};addEventListener('keydown',e=>{if(e.key==='ArrowUp')cmd('f');if(e.key==='ArrowDown')cmd('b');if(e.key==='ArrowLeft')cmd('l');if(e.key==='ArrowRight')cmd('r');if(e.key===' ')cmd('s')});
function update(dt){if(q.auto&&!q.stop){let dx=q.t.x-q.x,dy=q.t.y-q.y,d=Math.hypot(dx,dy),want=Math.atan2(dy,dx),dif=Math.atan2(Math.sin(want-q.a),Math.cos(want-q.a));if(d<10){q.v=0;q.auto=false;document.getElementById('ms').textContent='COMPLETE';log('TARGET REACHED — software simulation complete')}else{q.a+=Math.max(-.08,Math.min(.08,dif));q.v=1.1}}q.x+=Math.cos(q.a)*q.v*dt*30;q.y+=Math.sin(q.a)*q.v*dt*30;document.getElementById('p').textContent=q.x.toFixed(1)+', '+q.y.toFixed(1);document.getElementById('h').textContent=((q.a*180/Math.PI+360)%360).toFixed(0)+'°';document.getElementById('v').textContent=Math.abs(q.v).toFixed(1)+' m/s';document.getElementById('d').textContent=Math.hypot(q.t.x-q.x,q.t.y-q.y).toFixed(0)+' m'}function draw(){x.clearRect(0,0,W,H);x.fillStyle='#061017';x.fillRect(0,0,W,H);let s=Math.min(W,H)/600;x.save();x.translate(W/2,H/2);x.strokeStyle='#122832';for(let i=-600;i<=600;i+=40){x.beginPath();x.moveTo(i*s,-600*s);x.lineTo(i*s,600*s);x.stroke();x.beginPath();x.moveTo(-600*s,i*s);x.lineTo(600*s,i*s);x.stroke()}x.save();x.translate(q.t.x*s,q.t.y*s);x.rotate(Math.PI/4);x.fillStyle='#ffc857';x.fillRect(-8,-8,16,16);x.restore();x.strokeStyle='#244552';x.setLineDash([5,6]);x.beginPath();x.moveTo(q.x*s,q.y*s);x.lineTo(q.t.x*s,q.t.y*s);x.stroke();x.setLineDash([]);x.save();x.translate(q.x*s,q.y*s);x.rotate(q.a);x.fillStyle='#35d0ff';x.fillRect(-13,-9,26,18);x.fillStyle='#071018';x.fillRect(5,-5,7,10);x.restore();x.restore()}let last=performance.now();function loop(t){let dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}log('TACTIS-VR software dashboard ready');requestAnimationFrame(loop);
</script></body></html>
